<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<style>
@import url('https://cdn.jsdelivr.net/gh/MonadABXY/mona-font/web/mona.css');

@font-face {
    font-family: 'BoldRound';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2507-2@1.0/BoldDungGeunMo.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}

:root {
    --accent: #5f8f7a;
    --accent-soft: #8fb3a3;
}

body {
    background-image: url("https://subtle-crimson-e3cjpehsmx.edgeone.app/%EC%A0%9C%EB%8B%88%EC%8A%A4%EB%A7%81%20%EB%B0%B0%EA%B2%BD.jpg");
    background-size: cover;      
    background-position: center; 
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    height: 100vh;
    font-family: 'Mona12', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* 본체  */
.container {
    width: min(480px, calc(100vw - 32px));
    height: auto;
    padding: 22px;
    background: #2b2f33;
    border: 3px solid #1f2326;
    border-radius: 14px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 4px 6px 0 #121417;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.title {
    font-family: 'BoldRound', sans-serif;
    font-size: 20px;
    letter-spacing: 1px;
    color: var(--accent);
}

.status {
    font-size: 11px;
    color: #9aa0a6;
}

/* 화면 */
.screen {
    height: clamp(200px, 35vw, 280px);
    background: #f4fbf7;
    border: 2px solid #cfd4da;
    border-radius: 6px;
    padding: 18px;
    padding-top: 30px;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;     /* ← 추가 */
    justify-content: center; 
}

/* 화면 상단 UI */
.screen-top {
    position: absolute;
    top: 6px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #555;
}

/* CRT 느낌 */
.screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.03),
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
}

/* 배터리 */
.battery {
    width: 28px;
    height: 14px;
    border: 2px solid #999;
    border-radius: 3px;
    position: relative;
    padding: 2px;
    box-sizing: border-box;
}

.battery::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 4px;
    width: 3px;
    height: 6px;
    background: #999;
    border-radius: 1px;
}

.battery-level {
    height: 100%;
    width: 70%;
    background: var(--accent);
    border-radius: 1px;
    animation: batteryBlink 2s infinite;
}

@keyframes batteryBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 버튼 */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
    grid-template-rows: 1fr 1fr;
}

.btn {
    display: flex;
    font-family: 'Mona12', sans-serif;
    flex-direction: column;
    height: 100%;
    align-items: center;
    justify-content: center;
    padding: 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    background: #e9ecef;
    border: 2px solid #ced4da;
    box-shadow: 3px 3px 0 #adb5bd;
    transition: 0.1s;
    color: #495057;
}

.btn svg {
    width: 34px;
    height: 34px;
    margin-bottom: 4px;
    fill: var(--accent);
}

.btn:hover {
    transform: translateY(-1px);
    background: #dee2e6;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 1px 1px 0 #868e96;
}

.footer {
    margin-top: 15px;
    font-size: 11px;
    text-align: center;
    color: #868e96;
    letter-spacing: 1px;
}

/* 노이즈 */
.noise {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
    opacity: 0.35;
    z-index: 100;
}

    h2{
        text-align: center;
    }

    .login-box{
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    input{
        font-family: 'Mona12', sans-serif;
        width: 60%;
        padding: 2%;
    }

    .btn#loginBtn{
        display: flex;
        width: 65%;
        font-family: 'Mona12', sans-serif;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 9px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        background: #e9ecef;
        border: 2px solid #ced4da;
        box-shadow: 2px 2px 0 #adb5bd;
        transition: 0.1s;
        color: #495057;
    }

    /* Centered icon */
  .mail-wrapper {
    position: relative;
    animation: float 2s ease-in-out infinite;
    cursor: pointer;
  }

  @keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  /* Badge */
  .badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Modal background */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }

  .modal.active {
    display: flex;
  }

  /* Modal box */
  .modal-content {
    background: white;
    padding: 24px;
    border-radius: 16px;
    width: 300px;
    text-align: center;
    font-size: 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: pop 0.3s ease;
    width: min(420px, calc(100vw - 48px));
     display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .close-btn {
    margin-top: 16px;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: #007f58;
    color: white;
    cursor: pointer;
  }

</style>
<body>
<div class="container">
  <div class="header">
    <div class="title">ZENITH RING</div>
  </div>
  <div class="screen">
    <div class="screen-top">
        <span>v1.0</span>
            <div class="status">ONLINE</div>
            <div class="battery">
                <div class="battery-level"></div>
            </div>
    </div>

    <div class="mail-wrapper" onclick="openModal()">
  <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24">
    <path fill="#007f58" d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h16q.825 0 1.413.588T22 6v12q0 .825-.587 1.413T20 20zm8-7L4 8v10h16V8zm0-2l8-5H4zM4 8V6v12z"/>
  </svg>
  <div class="badge" id="badge">1</div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    안녕하세요.<br><br>
소넷입니다.<br><br>

금일 스토리 0차 진행이 마무리되었습니다.<br>
예상보다 많은 분들이 함께해주셨고, 생각 이상으로 즐겨주신 것 같아 기쁘게 생각합니다.<br><br>

배틀 시스템을 직접 제작하며 여러 시행착오가 있었지만,<br> 여러분이 남겨주신 반응과 플레이를 보며 충분히 보람을 느꼈습니다.<br>

진심으로 감사드립니다.<br><br>

보다 나은 경험으로 찾아뵐 수 있도록 준비하겠습니다.<br>

그때 다시 뵙겠습니다.<br><br>

방학 잘 보내라~!<br><br>
— 소넷
    <button class="close-btn" onclick="closeModal()">닫기</button>
  </div>
</div>
      
  </div>
  <div class="footer">Made by Sonnet with Ampharos</div>
</div>


<script>
     function openModal() {
    document.getElementById('modal').classList.add('active');

    // 읽음 처리 → badge 제거
    const badge = document.getElementById('badge');
    if (badge) badge.style.display = 'none';
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  // 바깥 클릭 시 닫기
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>

</body>
</html>
