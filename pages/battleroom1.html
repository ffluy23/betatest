<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.login-page { height: 100vh; background: #ffffff; display: flex; justify-content: center; align-items: center; }
.login-container { width: 100%; max-width: 400px; padding: 40px 24px; text-align: center; }
.login-container h2 { font-size: 28px; font-weight: 600; margin-bottom: 32px; color: #111; }
.login-box { display: flex; flex-direction: column; gap: 16px; }
.login-box input { padding: 14px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: 0.2s; }
.login-box input:focus { outline: none; border-color: #000; }
.btn { padding: 14px; border: none; border-radius: 8px; background: #000; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #222; }
.btn:active { transform: scale(0.98); }
@media (max-width: 480px) { .login-container { padding: 24px 16px; } .login-container h2 { font-size: 24px; } .login-box input { padding: 12px; } .btn { padding: 12px; } }
.main-page { height: 100vh; background: #fff; display: flex; justify-content: center; align-items: center; }
.main-container { width: 100%; max-width: 420px; padding: 40px 20px; text-align: center; }
.logo { font-size: 28px; font-weight: 700; margin-bottom: 40px; color: #111; letter-spacing: -0.5px; }
.menu { display: flex; flex-direction: column; gap: 16px; }
.menu-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 10px; background: #fff; color: #111; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn:hover { background: #000; color: #fff; border-color: #000; }
.menu-btn:active { transform: scale(0.98); }
@media (max-width: 480px) { .main-container { padding: 24px 16px; } .logo { font-size: 24px; margin-bottom: 30px; } .menu-btn { padding: 14px; font-size: 14px; } }
.battle-page { background: #fff; min-height: 100vh; display: flex; justify-content: center; }
.battle-container { width: 100%; max-width: 480px; padding: 24px 16px; }
.title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.main-box { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.player { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.player-card { padding: 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; font-size: 14px; }
.button { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.btn { padding: 12px 16px; border-radius: 8px; border: none; background: #000; color: #fff; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn:hover { background: #222; }
.btn:active { transform: scale(0.97); }
.btn.outline { background: #fff; color: #000; border: 1px solid #ddd; }
.btn.outline:hover { background: #000; color: #fff; border-color: #000; }
.spectator-box { border: 1px solid #ddd; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.spectator-box h3 { font-size: 14px; margin-bottom: 6px; }
.swap-box { padding: 12px; border-radius: 10px; background: #f7f7f7; font-size: 13px; color: #333; }
.info {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  background: #fafafa;
  font-size: 13px;
  color: #333;
  line-height: 1.5;
  text-align: left;
}
@media (max-width: 480px) { .main-box { flex-direction: column; } .button { flex-direction: row; justify-content: center; } .btn { flex: 1; } }
  </style>
</head>
<body class="battle-page">
  <div class="battle-container">
    <h2 class="title">BattleRoom</h2>
    <div class="main-box">
      <div class="player">
        <div id="player1" class="player-card">Player1: 대기 중...</div>
        <div id="player2" class="player-card">Player2: 대기 중...</div>
      </div>
      <div class="button">
        <button class="btn" id="readyBtn">Ready</button>
        <button class="btn outline" id="leaveBtn">Leave</button>
      </div>
    </div>
    <div class="spectator-box">
      <h3>관전자</h3>
      <div id="spectator-list">관전자 없음</div>
    </div>
    <div id="swap-request-display" class="swap-box">
    <div id="swap-request-display" class="swap-box">
 
</div>
  <script>const ROOM_ID = "battleroom1"</script>
  <script type="module" src="../js/firebase.js"></script>
  <script type="module" src="../js/battleroom.js"></script>
</body>
</html>
