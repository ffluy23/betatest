<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battle Room 3 — 제니스고등학교</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    /* ── 페이지 레이아웃 ── */
    .room-page {
      max-width: 680px;
      margin: 0 auto;
      padding: calc(var(--header-h) + 32px) 24px 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── 페이지 헤더 ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeUp 0.4s ease both;
    }
    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      color: var(--text-sub);
      text-decoration: none;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s;
    }
    .back-link:hover { background: var(--green-pale); border-color: var(--green-light); color: var(--green-dark); }
    .page-title    { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    .page-subtitle { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    /* ── 공통 카드 ── */
    .r-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      animation: fadeUp 0.45s ease both;
    }
    .r-card-head {
      padding: 16px 22px 13px;
      border-bottom: 1px solid var(--gray-200);
    }
    .r-card-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .r-card-label::before {
      content: '';
      display: inline-block;
      width: 4px; height: 13px;
      background: var(--green-primary);
      border-radius: 2px;
    }
    .r-card-body { padding: 20px 22px; }

    /* ── 플레이어 섹션 ── */
    .player-card { animation-delay: 0.05s; }

    .player-slots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .player-slot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
    }
    .player-slot.active {
      background: var(--green-pale);
      border-color: var(--green-light);
    }

    .slot-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      flex-shrink: 0;
    }
    .player-slot.active .slot-num {
      background: var(--green-primary);
      color: var(--white);
    }

    .slot-info { flex: 1; min-width: 0; }
    .slot-label { font-size: 10px; color: var(--gray-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .slot-name  { font-size: 14px; font-weight: 600; color: var(--text-main); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-name.waiting { color: var(--gray-400); font-weight: 400; }

    /* 버튼 행 */
    .action-row {
      display: flex;
      gap: 10px;
    }
    .btn-action {
      flex: 1;
      padding: 11px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.18s;
      border: 1.5px solid transparent;
    }
    .btn-ready {
      background: var(--green-primary);
      color: var(--white);
      border-color: var(--green-primary);
    }
    .btn-ready:hover  { background: var(--green-dark); border-color: var(--green-dark); }
    .btn-ready:active { transform: scale(0.97); }
    .btn-leave {
      background: transparent;
      color: var(--gray-400);
      border-color: var(--gray-200);
    }
    .btn-leave:hover  { border-color: #e05c5c; color: #e05c5c; }

    /* ── 관전자 / 교체 요청 ── */
    .spectator-card { animation-delay: 0.1s; }

    #spectator-list {
      font-size: 14px;
      color: var(--text-sub);
      min-height: 24px;
    }

    #swap-request-display {
      margin-top: 10px;
      font-size: 13px;
      color: var(--green-dark);
      min-height: 20px;
    }

    /* ── 관리자 패널 ── */
    #admin-panel {
      display: none;
      animation-delay: 0.15s;
    }
    .admin-panel-inner {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 2px solid #f0c040;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
      animation-delay: 0.15s;
    }
    .admin-head {
      padding: 14px 22px;
      background: #fffbea;
      border-bottom: 1px solid #f0c040;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-head-title { font-size: 13px; font-weight: 700; color: #9a7200; }
    .admin-badge {
      font-size: 10px;
      background: #fff3cd;
      border: 1px solid #e0c060;
      border-radius: 4px;
      padding: 1px 7px;
      color: #9a7200;
      font-weight: 600;
    }
    .admin-body { padding: 18px 22px; }

    #admin-hint {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
      min-height: 16px;
    }

    #admin-player-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .admin-slot-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      padding: 10px 14px;
      background: var(--gray-100);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      min-width: 110px;
    }
    .admin-slot-btn:hover { background: var(--green-pale); border-color: var(--green-light); transform: translateY(-1px); }
    .admin-slot-btn:active { transform: translateY(1px); }
    .admin-slot-btn.selected { border-color: var(--green-primary); background: var(--green-pale); }
    .admin-slot-btn.empty { opacity: 0.4; cursor: default; pointer-events: none; }

    .admin-slot-label { font-size: 10px; color: var(--gray-400); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
    .admin-slot-name  { font-size: 13px; color: var(--text-main); font-weight: 700; }

    /* ── 모바일 ── */
    @media (max-width: 768px) {
      .room-page      { padding: calc(var(--header-h) + 20px) 14px 88px; gap: 14px; }
      .r-card-body    { padding: 16px; }
      .player-slots   { grid-template-columns: 1fr; gap: 10px; }
      .admin-body     { padding: 14px 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a class="header-brand" href="../index.html">
      <img
        src="../image/뱃지.png"
        alt="제니스고등학교 뱃지"
        class="header-badge"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />
      <div class="header-badge-fallback" style="display:none;">🏫</div>
      <span class="header-school-name">제니스고등학교</span>
    </a>
    <div class="search-wrap" id="search-wrap">

      </svg>
      <input type="text" id="search-input" placeholder="검색" autocomplete="off" />
    </div>
  </header>

  <!-- ─── 메인 ─── -->
  <div class="room-page">

    <!-- 페이지 헤더 -->
    <div class="page-header">
      <a href="../battle.html" class="back-link">←</a>
      <div>
        <div class="page-title">Battle Room 3</div>
        <div class="page-subtitle">입장 후 Ready를 눌러주세요</div>
      </div>
    </div>

    <!-- 플레이어 카드 -->
    <div class="r-card player-card">
      <div class="r-card-head">
        <div class="r-card-label">플레이어</div>
      </div>
      <div class="r-card-body">
        <div class="player-slots">
          <div class="player-slot" id="slot1">
            <div class="slot-num">1</div>
            <div class="slot-info">
              <div class="slot-label">Player 1</div>
              <div class="slot-name waiting" id="player1">대기 중...</div>
            </div>
          </div>
          <div class="player-slot" id="slot2">
            <div class="slot-num">2</div>
            <div class="slot-info">
              <div class="slot-label">Player 2</div>
              <div class="slot-name waiting" id="player2">대기 중...</div>
            </div>
          </div>
        </div>
        <div class="action-row">
          <button class="btn-action btn-ready" id="readyBtn">Ready</button>
          <button class="btn-action btn-leave" id="leaveBtn">Leave</button>
        </div>
      </div>
    </div>

    <!-- 관전자 / 교체 요청 -->
    <div class="r-card spectator-card">
      <div class="r-card-head">
        <div class="r-card-label">관전자</div>
      </div>
      <div class="r-card-body">
        <div id="spectator-list">관전자 없음</div>
        <div id="swap-request-display"></div>
      </div>
    </div>

    <!-- 관리자 패널 -->
    <div id="admin-panel">
      <div class="admin-panel-inner">
        <div class="admin-head">
          <span style="font-size:16px;">⚙️</span>
          <span class="admin-head-title">강제 자리 교체</span>
          <span class="admin-badge">ADMIN</span>
        </div>
        <div class="admin-body">
          <div id="admin-hint">교체할 사람을 선택하세요</div>
          <div id="admin-player-grid"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ─── 모바일 하단 네비 ─── -->

  <script>
    const ROOM_ID = "battleroom3"

    // 모바일 검색창 토글
    const searchWrap  = document.getElementById('search-wrap');
    const searchInput = document.getElementById('search-input');
    if (searchWrap && searchInput) {
      searchWrap.querySelector('svg').addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
          e.stopPropagation();
          searchWrap.classList.toggle('expanded');
          if (searchWrap.classList.contains('expanded')) searchInput.focus();
        }
      });
      document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && !searchWrap.contains(e.target))
          searchWrap.classList.remove('expanded');
      });
      searchInput.addEventListener('blur', () => {
        if (window.innerWidth <= 768)
          setTimeout(() => searchWrap.classList.remove('expanded'), 200);
      });
    }
  </script>
  <script type="module" src="../js/battleroom.js"></script>
</body>
</html>
