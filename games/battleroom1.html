<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .button {
      display: flex;
      gap: 5%;
    }
    #spectator-list {
      margin-top: 10px;
    }
    .main-box {
      display: flex;
      justify-content: space-between;
    }
    @media (max-width: 480px) {
      .main-box {
        flex-direction: column;
        gap: 10px;
      }
      .button {
        justify-content: center;
      }
    }

    /* 어드민 패널 */
    #admin-panel {
      display: none;
      width: min(480px, calc(100vw - 32px));
      margin-top: 12px;
      background: #2b2f33;
      border: 3px solid #1f2326;
      border-radius: 14px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 4px 6px 0 #121417;
      padding: 16px 22px;
      box-sizing: border-box;
    }

    #admin-panel .admin-title {
      font-family: 'BoldRound', sans-serif;
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    #admin-hint {
      font-size: 11px;
      color: #9aa0a6;
      margin-bottom: 10px;
      min-height: 16px;
    }

    #admin-player-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .admin-slot-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 8px 12px;
      background: #e9ecef;
      border: 2px solid #ced4da;
      border-radius: 6px;
      box-shadow: 3px 3px 0 #adb5bd;
      cursor: pointer;
      font-family: 'Mona12', sans-serif;
      transition: 0.1s;
      min-width: 100px;
    }

    .admin-slot-btn:hover {
      transform: translateY(-1px);
      background: #dee2e6;
    }

    .admin-slot-btn:active {
      transform: translateY(3px);
      box-shadow: 1px 1px 0 #868e96;
    }

    .admin-slot-btn.selected {
      border-color: var(--accent);
      background: #d4ede4;
      box-shadow: 3px 3px 0 var(--accent-soft);
    }

    .admin-slot-btn.empty {
      opacity: 0.45;
      cursor: default;
    }

    .admin-slot-label {
      font-size: 10px;
      color: #868e96;
    }

    .admin-slot-name {
      font-size: 12px;
      color: #495057;
      font-weight: bold;
    }
  </style>
  <title>Battleroom1</title>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">ZENITH RING</div>
  </div>
  <div class="screen">
    <div class="screen-top">
      <span>v1.0</span>
      <div class="status">ONLINE</div>
      <div class="battery">
        <div class="battery-level"></div>
      </div>
    </div>
    <h2>Battle Room 1</h2>
    <div class="main-box">
      <!--플레이어-->
      <div class="player">
        <div id="player1">Player1: 대기 중...</div>
        <div id="player2">Player2: 대기 중...</div>
      </div>
      <!--버튼-->
      <div class="button">
        <button class="btn" id="readyBtn">Ready</button>
        <button class="btn" id="leaveBtn">Leave</button>
      </div>
    </div>

    <!--관전자-->
    <div id="spectator-list">관전자 없음</div>

    <!--교체 요청 표시-->
    <div id="swap-request-display"></div>
  </div>
  <div class="footer">Made by Sonnet with Ampharos</div>
</div>

<!-- 어드민 패널 (푸터 밑) -->
<div id="admin-panel">
  <div class="admin-title">⚙ ADMIN — 강제 자리 교체</div>
  <div id="admin-hint">교체할 사람을 선택하세요</div>
  <div id="admin-player-grid"></div>
</div>

<script>
  const ROOM_ID = "battleroom1"
</script>
<script type="module" src="../js/firebase.js"></script>
<script type="module" src="../js/battleroom.js"></script>
</body>
</html>
