<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>베타테스트</title>
  <style>
/* 메인 페이지 */
.main-page {
  position: relative;
  height: 100vh;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* 컨테이너 */
.main-container {
  width: 100%;
  max-width: 420px;
  padding: 40px 20px;
  text-align: center;
  position: relative;
  z-index: 1;
}

/* 로고 */
.logo {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 40px;
  color: #111;
  letter-spacing: -0.5px;
}

/* 메뉴 영역 */
.menu {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 버튼 */
.menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  width: 100%;
  padding: 16px;

  border: 1px solid #ddd;
  border-radius: 10px;

  background: #fff;
  color: #111;
  font-size: 15px;
  font-weight: 600;

  cursor: pointer;
  transition: all 0.2s ease;
}

/* 아이콘 */
.menu-btn svg {
  width: 20px;
  height: 20px;
}

/* hover */
.menu-btn:hover {
  background: #000;
  color: #fff;
  border-color: #000;
}

/* 클릭 */
.menu-btn:active {
  transform: scale(0.98);
}

/* 상단 이미지 영역 */
.image-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 150px;
  display: flex;
  overflow: hidden;
}

.image-top img {
  height: 150px;
  width: auto;
}

/* 하단 이미지 영역 */
.image-bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 150px;
  display: flex;
  overflow: hidden;
}

.image-bottom img {
  height: 150px;
  width: auto;
}

/* 좌측 이미지 영역 */
.image-left {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  left: 0;
  width: 400px;
  height: 350px; 
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  overflow: hidden;
}

.image-left img {
  width: 150px;
  height: 150px;
  object-fit: cover;
}
/* 우측 이미지 영역 */
.image-right {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  right: 0;
  width: 400px;
  height: 350px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  overflow: hidden;
}

.image-right img {
  width: 150px;
  height: 150px;
  object-fit: cover;
}

/* 메일 뱃지 */
.badge {
  display: none;
  position: absolute;
  top: -6px;
  right: -6px;
  background: #e53e3e;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  align-items: center;
  justify-content: center;
}

.badge.show {
  display: flex;
}

.mail-btn-wrap {
  position: relative;
  display: inline-block;
  width: 100%;
}

/* 모바일 */
@media (max-width: 480px) {
  .main-container {
    padding: 24px 16px;
  }

  .logo {
    font-size: 24px;
    margin-bottom: 30px;
  }

  .menu-btn {
    padding: 14px;
    font-size: 14px;
  }
}
  </style>
</head>

<body class="main-page">

  <div class="image-top">
    <img src="image/4521329333946.jpg" alt="">
    <img src="image/8809945331789.png" alt="">
    <img src="image/HHIrCHDbYAAlXKd.png" alt="">
    <img src="image/image copy.png" alt="">
    <img src="image/image13.png" alt="">
    <img src="image/image14.png" alt="">
  </div>

  <div class="image-bottom">
    <img src="image/image1.png" alt="">
    <img src="image/image2.png" alt="">
    <img src="image/image3.png" alt="">
    <img src="image/image4.png" alt="">
  </div>

  <div class="image-left">
    <img src="image/image5.png" alt="">
    <img src="image/image6.png" alt="">
    <img src="image/image7.png" alt="">
    <img src="image/image8.png" alt="">
  </div>

  <div class="image-right">
    <img src="image/image9.png" alt="">
    <img src="image/image10.png" alt="">
    <img src="image/image11.png" alt="">
    <img src="image/image12.png" alt="">
    

  </div>

  <div class="main-container">
    <div class="menu">
      <button class="menu-btn" onclick="location.href='profile/profile.html'">프로필</button>
      <button class="menu-btn" onclick="location.href='shop/shop.html'">상점</button>
      <div class="mail-btn-wrap">
        <button class="menu-btn" onclick="location.href='mail/mail.html'">메일</button>
        <span id="mail-badge" class="badge"></span>
      </div>
      <button class="menu-btn" onclick="location.href='battle.html'">배틀</button>
      <button class="menu-btn" onclick="location.href='ursalunaflip/ursaluna.html'">다투곰 뒤집기</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase.js"
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
    import { doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"

    onAuthStateChanged(auth, user => {
      if (!user) {
        location.href = "index.html"
        return
      }

      onSnapshot(doc(db, "users", user.uid), snap => {
        const data = snap.data()
        const inbox = data?.inbox ?? []
        const total = inbox.filter(n => !n.read).length

        const badge = document.getElementById("mail-badge")
        if (total > 0) {
          badge.innerText = total
          badge.classList.add("show")
        } else {
          badge.classList.remove("show")
        }
      })
    })
  </script>
</body>
</html>
